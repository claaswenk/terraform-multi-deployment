name: Terraform deployment

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  terraform-dev:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.head_ref == 'dev')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform deployment (development)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: .github/workflows/mock-credentials.json
        run: |
          terraform plan -input=false -out=local.tfplan \
            -var="project=app-dev-project" \
            -var="location=europe-north1" \
            -var="replicas=1" \
            -var="enableExternalIP=false"

      - name: Annotate Terraform output changes
        shell: bash
        run: |
          output_changes="$(terraform show -no-color local.tfplan | awk '/^Changes to Outputs:/{show=1} show')"
          if [[ -n "$output_changes" ]]; then
            output_changes="${output_changes//'%'/'%25'}"
            output_changes="${output_changes//$'\r'/'%0D'}"
            output_changes="${output_changes//$'\n'/'%0A'}"
            printf '::notice title=Terraform output changes (development)::%s\n' "$output_changes"
          fi

  terraform-prod:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform deployment (production)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: .github/workflows/mock-credentials.json
        run: |
          terraform plan -input=false -out=local.tfplan \
            -var="project=app-prod-project" \
            -var="location=europe-central2" \
            -var="replicas=4" \
            -var="enableExternalIP=true"

      - name: Annotate Terraform output changes
        shell: bash
        run: |
          output_changes="$(terraform show -no-color local.tfplan | awk '/^Changes to Outputs:/{show=1} show')"
          if [[ -n "$output_changes" ]]; then
            output_changes="${output_changes//'%'/'%25'}"
            output_changes="${output_changes//$'\r'/'%0D'}"
            output_changes="${output_changes//$'\n'/'%0A'}"
            printf '::notice title=Terraform output changes (production)::%s\n' "$output_changes"
          fi
