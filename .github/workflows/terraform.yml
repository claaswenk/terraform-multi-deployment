name: Terraform deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform deployment
        env:
          # Reference mock-credentials to make Terraform's Google-Provider not complain about missing
          # credentials for the plan. They are not required, since tf-apply never runs.
          GOOGLE_APPLICATION_CREDENTIALS: .github/workflows/mock-credentials.json
        run: terraform plan -input=false -out=local.tfplan -var-file=configuration/sample.tfvars.json

      # Pretty print the changes to the Terraform Outputs directly into the GitHub Workflow Annotations for convenience
      - name: Annotate Terraform output changes
        shell: bash
        run: |
          output_changes="$(terraform show -no-color local.tfplan | awk '/^Changes to Outputs:/{show=1} show')"
          if [[ -n "$output_changes" ]]; then
            output_changes="${output_changes//'%'/'%25'}"
            output_changes="${output_changes//$'\r'/'%0D'}"
            output_changes="${output_changes//$'\n'/'%0A'}"
            printf '::notice title=Terraform output changes::%s\n' "$output_changes"
          fi
